name: Release

# Phase 1 (simple): manual release from the Actions tab.
#   1. Bump "version" in packages/nextfinder/package.json via a pull request.
#   2. Merge it to main.
#   3. Actions -> Release -> Run workflow (keep "dry run" on first, then run again with it off).
# Publishing uses npm trusted publishing (OIDC). There are no npm tokens in this repo.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate and pack, do not publish)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Must match the "Environment name" configured in the npm trusted publisher (case-sensitive).
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@11

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Validate package
        run: node scripts/check-package.mjs

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: packages/nextfinder
        run: npm publish --dry-run --access public

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: packages/nextfinder
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public
